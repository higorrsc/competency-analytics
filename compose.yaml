services:
  db:
    image: postgres:16-alpine
    container_name: competency-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-competency_analytics}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      TZ: ${TIME_ZONE:-America/Sao_Paulo}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-competency_analytics}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

networks:
  db-net:
